name: Scrape departamentos Miramar

on:
  schedule:
    - cron: "0 9 * * *" # todos los días 9am UTC (6am ARG)
  workflow_dispatch: {} # permite correrlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Correr scrapers
        run: npm run scrape:build

      - name: Commitear resultados actualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/departamentos.json
          git diff --staged --quiet || git commit -m "chore: actualizar departamentos $(date -u +%Y-%m-%d)"
          git push
